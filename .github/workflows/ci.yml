name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build Mori.Ros2Sharp.slnx -c Release
      - name: Test
        run: dotnet test tests/Mori.Ros2Sharp.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Pack
        run: |
          dotnet pack src/Mori.Ros2Sharp -c Release --no-build -o artifacts
          dotnet pack src/Mori.Ros2Sharp.MsgGen -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
